# mpSEEJAY 1.0: a media-player deck for an external DJ mixer, two decks (A and B), each on its own MPC output.
# PLAY is built round the 16 MPC pads: the tiles mirror them, coloured by function, lit while held. Pad 8 is SHIFT.
# The big A / B switch picks the deck on screen; everything takes its colour: A blue, B red.
